<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Pertemuan Kombel MGMP</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Main Wrapper -->
  <main class="flex-grow">
    
    <!-- ================= HOMESCREEN SECTION ================= -->
    <section id="sectionHomescreen" class="max-w-md mx-auto px-4 py-12 flex flex-col items-center justify-center min-h-screen">
      
      <!-- Card Homescreen -->
      <div class="w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
        
        <!-- Logo Header (Sejajar dalam folder yang sama) -->
        <div class="flex items-center justify-center gap-4 mb-6">
          <img src="logo-sma.png" alt="Logo SMA" class="h-16 w-auto object-contain">
          <img src="logo-kombel.png" alt="Logo Kombel" class="h-16 w-auto object-contain">
        </div>

        <h1 class="text-xl font-bold text-slate-800">Jurnal Pertemuan Kombel</h1>
        <p class="text-xs text-slate-500 mb-6">Komunitas Belajar Guru MGMP</p>

        <!-- Form LogIn Guru -->
        <div class="space-y-4 text-left mb-6">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih MGMP / Mapel</label>
            <select id="selectMgmp" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
              <option value="">-- Pilih MGMP --</option>
              <option value="Fisika">Fisika</option>
              <option value="Agama">Agama</option>
              <option value="IPA">IPA</option>
              <option value="Matematika">Matematika</option>
              <option value="Bahasa Indonesia">Bahasa Indonesia</option>
              <option value="Bahasa Inggris">Bahasa Inggris</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Pertemuan</label>
            <input type="date" id="inputTanggal" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          </div>
        </div>

        <!-- Tombol LogIn -->
        <button onclick="loginJurnal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-sm">
          <span>🚀</span> LogIn Ke Jurnal
        </button>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
          <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400">Atau</span></div>
        </div>

        <!-- Tombol Akses Admin -->
        <button onclick="bukaAdmin()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl transition duration-200 text-xs flex items-center justify-center gap-2">
          <span>⚙️</span> Akses Admin
        </button>

      </div>
    </section>


    <!-- ================= FORM JURNAL SECTION (4 PANEL) ================= -->
    <section id="sectionJurnal" class="hidden max-w-6xl mx-auto px-4 py-6">
      
      <!-- Topbar Info & Navigasi Logout -->
      <div class="bg-white rounded-xl shadow-md p-4 mb-6 flex flex-wrap items-center justify-between gap-4 border-l-4 border-blue-600">
        <div>
          <span class="text-xs text-slate-400 font-semibold uppercase">Pertemuan Terpilih</span>
          <h2 class="text-lg font-bold text-slate-800">
            MGMP <span id="infoMgmpActive" class="text-blue-600">-</span>
            <span class="text-slate-300 mx-1">|</span>
            Tanggal: <span id="infoTanggalActive" class="text-blue-600">-</span>
          </h2>
        </div>
        <button onclick="keluarJurnal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-4 py-2 rounded-lg text-xs transition flex items-center gap-1">
          <span>⬅️</span> Ganti MGMP / Logout
        </button>
      </div>

      <!-- 4 PANEL GRID -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Panel 1: Administrasi & Presensi -->
        <div class="bg-white p-5 rounded-xl shadow-md border-t-4 border-blue-500 flex flex-col justify-between">
          <div>
            <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
              <span>📋</span> 1. Administrasi & Presensi
            </h2>
            <div class="mb-4">
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Topik / Materi Pembahasan</label>
              <input type="text" id="inputTopik" placeholder="Contoh: Penyusunan Modul Ajar" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Presensi Guru (Daftar Hadir)</label>
              <div id="containerPresensi" class="max-h-48 overflow-y-auto p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-1.5 text-sm">
                <span class="text-slate-400 italic">Memuat data guru...</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Panel 2: Notulensi Hasil Diskusi -->
        <div class="bg-white p-5 rounded-xl shadow-md border-t-4 border-emerald-500 flex flex-col justify-between">
          <div>
            <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
              <span>📝</span> 2. Notulensi Hasil Diskusi
            </h2>
            <textarea id="inputNotulensi" rows="8" placeholder="Tuliskan poin-poin penting dan hasil diskusi pertemuan hari ini..." class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm resize-none"></textarea>
          </div>
        </div>

        <!-- Panel 3: Rencana Tindak Lanjut (RTL) -->
        <div class="bg-white p-5 rounded-xl shadow-md border-t-4 border-amber-500 flex flex-col justify-between">
          <div>
            <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
              <span>🚀</span> 3. Rencana Tindak Lanjut (RTL)
            </h2>
            <textarea id="inputRtl" rows="8" placeholder="Tuliskan rencana aksi nyata atau tindak lanjut setelah pertemuan..." class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm resize-none"></textarea>
          </div>
        </div>

        <!-- Panel 4: Unggah & Dokumentasi -->
        <div class="bg-white p-5 rounded-xl shadow-md border-t-4 border-purple-500 flex flex-col justify-between">
          <div>
            <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
              <span>📸</span> 4. Unggah & Dokumentasi
            </h2>
            
            <!-- Link Dokumen (Opsional) -->
            <div class="mb-4">
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Link Dokumen (Opsional)</label>
              <input type="url" id="inputLink" placeholder="https://drive.google.com/..." class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
            </div>

            <!-- Live Camera Photo -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Foto Kegiatan (Kamera Live HP)</label>
              <input type="file" id="inputFoto" accept="image/*" capture="environment" onchange="previewFoto(event)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 cursor-pointer">
              
              <!-- Area Preview Foto -->
              <div class="mt-3 text-center">
                <img id="imgPreview" class="hidden max-h-40 mx-auto rounded-lg shadow border border-slate-200">
                <span id="txtFotoEksis" class="hidden text-xs text-emerald-600 font-semibold">✓ Foto kegiatan dari server sudah ada</span>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Tombol Simpan Jurnal -->
      <div class="mt-8 text-center">
        <button id="btnSimpan" onclick="simpanJurnal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-10 py-3.5 rounded-xl shadow-lg text-base transition duration-200 cursor-pointer">
          💾 Simpan Jurnal Pertemuan
        </button>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
